# Netlify config. Owner: netlify-engineer (Nico). Reviewed by security-expert (Hollis).
# No secrets here: netlify.toml env vars do not reach functions anyway.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Agent files and knowledge folders are read at runtime by /api/agents and /api/chat.
  included_files = [".claude/agents/**", "knowledge/*/docs/**", "knowledge/*/examples/**"]

[dev]
  command = "npx vite --port 5173"
  targetPort = 5173
  port = 8888
  framework = "#custom"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/agents/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"

# Static pages only. Functions set their own headers (custom headers do not apply to them).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://opentdb.com https://*.supabase.co; manifest-src 'self'; worker-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'"
