<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Trivia test fixture</title>
<link rel="stylesheet" href="/quiz.css"></head>
<body>
  <main>
    <h1 id="screen-title" tabindex="-1">Question 1 of 2</h1>
    <progress id="progress" max="2" value="1" aria-label="Progress">1 of 2</progress>
    <form id="q">
      <fieldset><legend id="question">Loading question…</legend><div id="answers"></div></fieldset>
    </form>
    <p id="feedback" aria-live="polite"></p>
  </main>
  <script src="/quiz.js" type="module"></script>
</body>
</html>
